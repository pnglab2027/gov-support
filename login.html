<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 지원E</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="header"></header>

  <main>
    <section class="section">
      <div class="inner fade">
        <h1 class="title">3초면 시작해요.</h1>
        <p class="sub">가입하면 매일 나에게 맞는<br>지원금을 알려드려요.</p>

        <div class="btn-wrap">
          <button class="btn btn-kakao" data-provider="kakao">카카오톡으로 3초만에 가입하기</button>
          <button class="btn btn-white" data-provider="google">구글로 계속하기</button>
        </div>
        <p class="notice" id="notice"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderHeader();

    const notice = document.getElementById("notice");

    document.querySelectorAll("[data-provider]").forEach(btn => {
      btn.onclick = async () => {
        const provider = btn.dataset.provider;

        const { error } = await sb.auth.signInWithOAuth({
          provider,
          options: { redirectTo: new URL("./", location.href).href }
        });
        if (error) notice.textContent = "로그인을 시작하지 못했어요. 잠시 후 다시 시도해 주세요.";
      };
    });
  </script>
</body>
</html>
